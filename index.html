<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contribution System</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<h1>Contribution System</h1>

<form id="contributionForm">

    <label for="amount">
        Contribution per person:
    </label>

    <input
        type="number"
        id="amount"
        placeholder="Enter amount"
        min="1"
        required
    >

    <label for="startDate">
        Contribution starting date:
    </label>

    <input
        type="date"
        id="startDate"
        required
    >

    <label for="numberOfPeople">
        Number of people:
    </label>

    <input
        type="number"
        id="numberOfPeople"
        placeholder="Minimum 10 people"
        min="10"
        required
    >

    <button type="submit">
        Continue
    </button>

</form>

<div id="nameInputs"></div>
<div id="schedule"></div>

<script src="script.js"></script>

</body>
</html>
